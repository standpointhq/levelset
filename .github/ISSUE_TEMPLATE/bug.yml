name: Something does not work
description: A tool answers wrongly, a client cannot connect, or an example fails.
labels: [bug]
body:
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude (web), Claude (desktop), Claude (mobile), ChatGPT, Claude Code, Cursor, Own code, Other]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: levels_get
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked, what you expected, what came back. Leave out API keys and personal data.
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When (with time zone)
      placeholder: 2026-10-28 15:20 CET
